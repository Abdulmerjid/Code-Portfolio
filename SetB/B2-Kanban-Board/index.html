<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Kanban Board</h1>

    <div class="form-container">

        <input
            type="text"
            id="title"
            placeholder="Card title"
        >

        <textarea
            id="description"
            placeholder="Description"
        ></textarea>

        <select id="priority">
            <option value="Low">
                Low
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="High">
                High
            </option>
        </select>

        <input
            type="date"
            id="dueDate"
        >

        <button id="addCardBtn">
            Add Card
        </button>

    </div>


    <div class="board">

        <div
            class="column"
            data-status="todo"
        >
            <h2>To Do</h2>

            <div
                class="card-container"
                id="todo"
            ></div>
        </div>


        <div
            class="column"
            data-status="progress"
        >
            <h2>In Progress</h2>

            <div
                class="card-container"
                id="progress"
            ></div>
        </div>


        <div
            class="column"
            data-status="done"
        >
            <h2>Done</h2>

            <div
                class="card-container"
                id="done"
            ></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
