<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Table</h1>

        <input
            type="text"
            id="search"
            placeholder="Search students..."
        >

        <table>

            <thead>
                <tr>
                    <th data-column="id">
                        ID
                    </th>

                    <th data-column="name">
                        Name
                    </th>

                    <th data-column="age">
                        Age
                    </th>

                    <th data-column="course">
                        Course
                    </th>

                    <th>
                        Action
                    </th>
                </tr>
            </thead>

            <tbody id="table-body">
            </tbody>

        </table>

        <div id="pagination">
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
