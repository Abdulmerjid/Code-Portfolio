<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0">

    <title>Movie Finder</title>

    <link rel="stylesheet"
          href="style.css">
</head>
<body>

    <div class="container">

        <h1>Movie Finder</h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Search movie..."
        >

        <div id="loading">
        </div>

        <div id="movies">
        </div>

        <div id="pagination">
        </div>

        <h2>Favourites</h2>

        <div id="favourites">
        </div>

    </div>

    <script src="script.js">
    </script>

</body>
</html>
